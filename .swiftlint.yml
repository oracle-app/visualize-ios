disabled_rules:
  - trailing_whitespace
  - identifier_name
  - line_length
  - function_parameter_count
  - empty_parameters
  - type_body_length
  - comma
  - type_name
  - orphaned_doc_comment
  - multiple_closures_with_trailing_closure

file_length:
  warning: 600

function_body_length:
  warning: 100
